spring.application.name=maintenance-system

# MongoDB (set via environment variable in production, e.g. on Render)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/maintenance_system}

# JWT
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-to-something-long-and-random-32chars+}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

# Server
server.port=${PORT:8030}

# Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:opeoluwaagnes@gmail.com}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME:noreply@miva.university}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Swagger UI at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# CORS allowed origin (your frontend URL) - comma separated
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

app.brevo.api-key=${BREVO_API_KEY:}
